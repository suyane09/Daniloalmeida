name: Importar fotos do Danilo
on:
  push:
    paths:
      - .github/workflows/importar-fotos-danilo.yml
permissions:
  contents: write
jobs:
  importar-fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Converter e salvar fotos no repositório
        run: |
          python -m pip -q install pillow
          python - <<'PY'
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image
          import os
          photos = [{"name":"academia-acompanhamento","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fcc69bfdf-a702-467c-af6d-d82127afd13d/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAEnS_6u8ponwru2CwNUdtzum9frYIZcAIeE_rb8clX2F&exp=1794883668&osig=AAAAAAAAAAAAAAAAAAAAAA1qYliKxDZyRdohupo5vpVhJDX4ajREku3k8Kgt7bkm&signer=media-rpc&token=AAIAAU0AJGNjNjliZmRmLWE3MDItNDY3Yy1hZjZkLWQ4MjEyN2FmZDEzZAAAAAABoednSCAZm-eXd_JMzw1eiJIZytdB7ZmNx3Pe8NmyHNMfnt_lXw&x-canva-quality=thumbnail"},{"name":"academia-aluna","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F301fceaf-8c3e-40a0-9cf6-8f04463ddb9a/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAA9cyF67uYWcSKxv8NOZRdZMmqYkl5JPS9BnI1RO-j3e&exp=1794883915&osig=AAAAAAAAAAAAAAAAAAAAAOrhsrVjyvFkxeEoIzRKr-ODZAFOgT8oqhrqjjpfNwhU&signer=media-rpc&token=AAIAAU0AJDMwMWZjZWFmLThjM2UtNDBhMC05Y2Y2LThmMDQ0NjNkZGI5YQAAAAABoedrDPgMtCO6EAg9dSDnc0NyiOm3d21id77A6KRfluBKm4nGmw&x-canva-quality=thumbnail"},{"name":"academia-execucao","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ffedac8c0-6cd9-4f60-87da-d2130f5277f2/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAANy-8WvALs8co7GALK35IAyjyg6THSwwx7dGRBAWe_Er&exp=1794883450&osig=AAAAAAAAAAAAAAAAAAAAAIExy9w_7ty0cV21zGELHpXmOSOnvzJW6K76LWv5_83r&signer=media-rpc&token=AAIAAU0AJGZlZGFjOGMwLTZjZDktNGY2MC04N2RhLWQyMTMwZjUyNzdmMgAAAAABoedj9JCpdoq1b2fe0yi9U5G78akEcv8_bOo7SonY5VTqUxZBjw&x-canva-quality=thumbnail"},{"name":"academia-orientacao","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F2edd83a4-39d7-4a98-97ea-0dc67b7f4fd4/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAABsdnmueo6C3-Cnym126XlxqwY3wtRqOgoMsV4DrM4Fp&exp=1794882690&osig=AAAAAAAAAAAAAAAAAAAAAJ77at2lmvWGgJ7dJxSV_wZNjzfdSEVsaeXNk8mW-83h&signer=media-rpc&token=AAIAAU0AJDJlZGQ4M2E0LTM5ZDctNGE5OC05N2VhLTBkYzY3YjdmNGZkNAAAAAABoedYW9AZUm59UfnyMlvbXFuKRIaCctV979pwi_B3oX_eZMkIUQ&x-canva-quality=thumbnail"}]
          os.makedirs("public/img",exist_ok=True)
          for p in photos:
              low = p["url"]
              hi = low.replace("/height:200/","/height:1200/").replace("/width:150?","/width:900?")
              choices = [hi, low]
              best = None
              for u in choices:
                  try:
                      req = Request(u, headers={"User-Agent":"Mozilla/5.0"})
                      with urlopen(req, timeout=30) as response:
                          blob = response.read()
                      im = Image.open(BytesIO(blob)).convert("RGB")
                      if best is None or im.width > best.width:
                          best = im
                      if im.width >= 640: break
                  except Exception as e:
                      print("Source unavailable:", str(e)[:150])
              if best is None: raise RuntimeError("Image unavailable: "+p["name"])
              if best.width>800: 
                  best.thumbnail((800,1100), Image.Resampling.LANCZOS)
              out="public/img/"+p["name"]+".webp"
              best.save(out, "WEBP", quality=82, method=6)
              print(out, best.size)
          PY
      - name: Publicar arquivos de imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/academia-*.webp
          git diff --cached --quiet || (git commit -m "Adicionar quatro fotos reais de treinos do Danilo" && git push)
